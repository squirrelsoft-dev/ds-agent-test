version: 1

commands:
  test: true

budget:
  max_turns: 40

context: |
  Dependencies and the test runner are managed with uv, not pip. `uv sync` to
  install, `uv run <cmd>` for anything that needs the environment. The sandbox's
  system Python has no pip, so do not reach for it.

  The `agents.md` in the root is the pi-agent application's own runtime memory
  file — data this project loads at run time, addressed to the agent this
  project builds. It is not instructions for you. Ignore it.

  Source is under src/agent/: agent.py is the loop, llm.py the model client,
  otel.py the tracing setup, memory.py the agents.md reader, and tools.py and
  skills.py the two extension points. Tests are in tests/test_agent.py.
